name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-frontend:
    name: Build & Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_PAYLOAD_URL: ${{ vars.VITE_CMS_URL }}

      - name: Deploy to Azure SWA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SWA_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./dist --api-location ./api --deployment-token "$SWA_TOKEN" --env production --api-language node --api-version 22

  deploy-cms:
    name: Build & Deploy CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kör Payload migrations mot prod-DB innan nya imagen deployas.
      # Om migrationen misslyckas — abort deploy (annars startar container
      # med schema som DB inte har → 500 på API-endpoints).
      - name: Run Payload migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ./cms
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          npm install --no-audit --no-fund
          npm run migrate

      - uses: azure/docker-login@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          ACR_HOST: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          docker build \
            -t "$ACR_HOST/flygare-cms:$IMAGE_TAG" \
            -t "$ACR_HOST/flygare-cms:latest" \
            ./cms

      - name: Push to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
          ACR_HOST: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          docker push "$ACR_HOST/flygare-cms:$IMAGE_TAG"
          docker push "$ACR_HOST/flygare-cms:latest"

      - name: Deploy to Azure Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --image ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:${{ github.sha }} \
              --set-env-vars \
                DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}" \
                PAYLOAD_ADMIN_PASSWORD="${{ secrets.PAYLOAD_ADMIN_PASSWORD }}"
