name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-frontend:
    name: Build & Deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}

      - name: Deploy to Azure SWA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm install -g @azure/static-web-apps-cli
          swa deploy ./dist --api-location ./api --deployment-token "$SWA_TOKEN" --env production --api-language node --api-version 22
        env:
          SWA_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}

  deploy-cms:
    name: Build & Deploy CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/docker-login@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        env:
          ADMIN_PW: ${{ secrets.PAYLOAD_ADMIN_PASSWORD }}
        run: |
          docker build \
            --build-arg PAYLOAD_ADMIN_PASSWORD="$ADMIN_PW" \
            -t ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:${{ github.sha }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:latest \
            ./cms

      - name: Push to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:latest

      - name: Deploy to Azure Container App
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ vars.CONTAINER_APP_NAME }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --image ${{ vars.ACR_LOGIN_SERVER }}/flygare-cms:${{ github.sha }}
