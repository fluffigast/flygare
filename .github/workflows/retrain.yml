name: Daily Model Retrain

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  retrain:
    name: Retrain wind model
    runs-on: ubuntu-latest
    env:
      BLOB_SAS: ${{ secrets.BLOB_SAS }}
      KUDU_PASSWORD: ${{ secrets.KUDU_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install lightgbm numpy

      - name: Download training data
        run: |
          python3 scripts/download_training_data.py
          echo "Blob records: $(wc -l < /tmp/blob-data.jsonl)"
          echo "JSONL pairs: $(wc -l < /tmp/training-pairs.jsonl)"

      - name: Train model
        run: python3 train_online.py

      - name: Show metrics
        run: |
          cat model/metrics.json
          echo ""
          cat model/previous/metrics.json 2>/dev/null || echo "No previous"

      - name: Deploy model to Azure
        if: success()
        run: |
          for f in median.txt low.txt high.txt metrics.json manifest.json approach.txt; do
            curl -s -X PUT \
              "https://vindare.scm.azurewebsites.net/api/vfs/site/wwwroot/model/$f" \
              -u "\$vindare:$KUDU_PASSWORD" \
              --data-binary "@model/$f" \
              -H "If-Match: *"
          done
          echo "Model deployed"
