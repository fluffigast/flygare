services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=payload
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-payload}
      - POSTGRES_DB=flygare
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d flygare"]
      interval: 5s
      timeout: 3s
      retries: 5

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://payload:${POSTGRES_PASSWORD:-payload}@db:5432/flygare
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${CMS_URL:-http://localhost:3001}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - NODE_ENV=production
    volumes:
      - cms-media:/app/media
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

volumes:
  pg-data:
  cms-media:
